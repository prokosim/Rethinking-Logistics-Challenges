name: ✏️ Correct something
description: Fix an error or add missing information.
title: 'Correction: '
labels:
- correction
body:
- type: markdown
  attributes:
    value: Thanks for helping keep the knowledge base accurate.
- type: input
  id: note
  attributes:
    label: Which page?
  validations:
    required: true
- type: textarea
  id: s_what
  attributes:
    label: What is wrong or missing?
  validations:
    required: true
- type: textarea
  id: s_fix
  attributes:
    label: What should it say?
  validations:
    required: true
- type: textarea
  id: s_sources
  attributes:
    label: Sources
  validations:
    required: false
