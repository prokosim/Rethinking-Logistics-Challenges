name: 📏 Add a metric
description: Propose a metric (KPI) with its unit and how it is calculated.
title: '[Metric] '
labels:
- contribution
- type:metric
body:
- type: markdown
  attributes:
    value: 'A **metric** is a measurable indicator used as evidence for a design decision.


      A maintainer reviews your submission. When it is labelled **accepted**, a bot turns it into a page and opens a pull request.'
- type: input
  id: name
  attributes:
    label: Metric name
    placeholder: e.g. Biotope area factor
  validations:
    required: true
- type: input
  id: category
  attributes:
    label: Category
    description: Any category, e.g. Energy, Carbon, Water, Biodiversity, Social, Logistics operations…
  validations:
    required: true
- type: input
  id: unit
  attributes:
    label: Unit
    placeholder: e.g. %, m², kWh/m²·year
  validations:
    required: true
- type: textarea
  id: calculation
  attributes:
    label: How is it calculated?
    description: 'One or two sentences: formula, method, or tool.'
  validations:
    required: true
- type: input
  id: origin
  attributes:
    label: Origin
    description: student / adapted / standard
  validations:
    required: false
- type: input
  id: standard
  attributes:
    label: Standard
    description: 'If taken from one: BREEAM, LEED, DGNB, …'
  validations:
    required: false
- type: textarea
  id: aliases
  attributes:
    label: Other names
    description: Other names people use for it, one per line.
  validations:
    required: false
- type: textarea
  id: challenges
  attributes:
    label: Which design challenges does it inform?
    description: One per line. Use names of existing pages where possible — new names are fine too.
  validations:
    required: false
- type: textarea
  id: s_what
  attributes:
    label: What it measures
    description: Why it matters for design decisions.
  validations:
    required: true
- type: checkboxes
  id: confirm
  attributes:
    label: Before you submit
    options:
    - label: I searched the site and this is not there yet.
      required: true
    - label: I did not copy text from standards, papers or other copyrighted sources.
      required: true
