# On every push to main: writes the reverse links (auto_ properties) into the notes,
# refreshes the overview pages, commits them back, then builds and publishes the website.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Sync reverse links and overview pages
        run: |
          node scripts/sync.mjs
          node scripts/generate-overviews.mjs
          if [ -n "$(git status --porcelain content)" ]; then
            git config user.name "kb-bot"
            git config user.email "kb-bot@users.noreply.github.com"
            git add content
            git commit -m "Sync reverse links and overview pages [skip ci]"
            git push
          fi

      - name: Cache Quartz
        uses: actions/cache@v4
        with:
          path: .quartz
          key: quartz-${{ hashFiles('site.config.json') }}

      - name: Build site
        env:
          SITE_REPO_URL: https://github.com/${{ github.repository }}
          SITE_BASE_URL: ${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node scripts/build-site.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
